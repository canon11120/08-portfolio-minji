<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MINI DEV의 Coding Lab</title>
<style>
:root{--bg:#0b1020;--card:#121a2f;--hover:#17213b;--border:#273352;--text:#f5f7ff;--muted:#a8b1c7;--purple:#8b5cf6;--light:#a78bfa;--dark:#6d28d9}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,"Noto Sans KR",sans-serif;background:radial-gradient(circle at 85% 5%,rgba(139,92,246,.16),transparent 30rem),var(--bg);color:var(--text);line-height:1.6;min-height:100vh}
.container{width:min(1100px,calc(100% - 40px));margin:auto}
.hero{padding:100px 0 80px;border-bottom:1px solid rgba(139,92,246,.18)}
.eyebrow,.section-label{color:var(--light);font-size:.8rem;font-weight:bold;letter-spacing:.18em}
.hero h1{margin-top:14px;font-size:clamp(2.5rem,7vw,5rem);line-height:1.08;letter-spacing:-.05em}
.hero h1 span{color:var(--light)}
.intro{max-width:650px;margin-top:24px;color:var(--muted);font-size:clamp(1rem,2vw,1.2rem)}
.projects{padding:75px 0 100px}
.section-title{margin:6px 0 30px;font-size:2rem}
.project-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:22px}
.project-card{display:flex;flex-direction:column;min-height:330px;padding:28px;background:rgba(18,26,47,.92);border:1px solid var(--border);border-radius:18px;transition:.2s}
.project-card:hover{transform:translateY(-6px);border-color:rgba(167,139,250,.7);background:var(--hover)}
.project-number{display:flex;align-items:center;justify-content:center;width:36px;height:36px;margin-bottom:22px;border-radius:10px;background:rgba(139,92,246,.14);color:var(--light);font-size:.85rem;font-weight:bold}
.project-card h3{margin-bottom:10px;font-size:1.35rem}
.project-card p{color:var(--muted);font-size:.95rem}
.tags{display:flex;flex-wrap:wrap;gap:8px;margin-top:20px}
.tag{padding:5px 10px;border:1px solid rgba(167,139,250,.28);border-radius:999px;background:rgba(109,40,217,.12);color:#d8ceff;font-size:.78rem;font-weight:bold}
.project-link{display:flex;align-items:center;justify-content:center;margin-top:auto;padding:11px 16px;border-radius:10px;background:var(--dark);color:white;text-decoration:none;font-weight:bold}
.project-link:hover{background:var(--purple)}
footer{padding:26px 0;border-top:1px solid var(--border);color:#717c96;font-size:.82rem;text-align:center}
@media(max-width:800px){.project-grid{grid-template-columns:1fr}.hero{padding:75px 0 60px}.projects{padding:60px 0 75px}}
@media(max-width:480px){.container{width:calc(100% - 28px)}.project-card{min-height:300px;padding:23px}}
</style>
</head>
<body>
<header class="hero">
<div class="container">
<p class="eyebrow">&lt; CODING LAB /&gt;</p>
<h1>MINI DEV의 <span>Coding Lab</span></h1>
<p class="intro">아이디어를 코드로 만들고, 직접 실행하며 성장하는 고등학생 개발자입니다.</p>
</div>
</header>

<main class="container">
<section class="projects">
<p class="section-label">PROJECTS</p>
<h2 class="section-title">내가 만든 작품</h2>
<div id="project-list" class="project-grid"></div>
</section>
</main>

<footer><div class="container"><p>© 2026 MINI DEV · Coding Lab</p></div></footer>

<script>
const projects = [
  {
    title: "Cookie Clicker",
    description: "쿠키를 클릭하고 업그레이드를 구매하며 자동으로 쿠키를 생산하는 방치형 게임입니다.",
    technologies: ["HTML", "CSS", "JavaScript"],
    url: "https://example.com/project1"
  },
  {
    title: "Study Timer",
    description: "공부 시간을 측정하고 집중 시간을 기록할 수 있는 웹 타이머입니다.",
    technologies: ["HTML", "JavaScript", "LocalStorage"],
    url: "https://example.com/project2"
  },
  {
    title: "Weather App",
    description: "지역을 검색하면 날씨를 확인할 수 있는 웹 애플리케이션입니다.",
    technologies: ["HTML", "CSS", "API"],
    url: "https://example.com/project3"
  }
];

const projectList = document.getElementById("project-list");

projects.forEach((project, index) => {
  const card = document.createElement("article");
  card.className = "project-card";

  const tags = project.technologies
    .map(technology => `<span class="tag">${technology}</span>`)
    .join("");

  card.innerHTML = `
    <span class="project-number">${String(index + 1).padStart(2, "0")}</span>
    <h3>${project.title}</h3>
    <p>${project.description}</p>
    <div class="tags">${tags}</div>
    <a class="project-link" href="${project.url}" target="_blank" rel="noopener noreferrer">
      작품 실행하기 ↗
    </a>
  `;

  projectList.appendChild(card);
});
</script>
</body>
</html>
